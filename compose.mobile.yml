name: maproulette-mobile

services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: maproulette
      POSTGRES_USER: maproulette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maproulette -d maproulette"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    image: maproulette-mobile-backend:local
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - /MapRouletteAPI/bin/maprouletteapi
      - -Dhttp.port=80
      - -Dpidfile.path=/dev/null
      - -Dconfig.file=/MapRouletteAPI/conf/mobile-staging.conf
    environment:
      MR_DATABASE_URL: jdbc:postgresql://db:5432/maproulette
      MR_DATABASE_USERNAME: maproulette
      MR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      APPLICATION_SECRET: ${APPLICATION_SECRET:?Set APPLICATION_SECRET in .env}
      MAPROULETTE_SECRET_KEY: ${MAPROULETTE_SECRET_KEY:?Set MAPROULETTE_SECRET_KEY in .env}
      MR_OSM_SERVER: ${MR_OSM_SERVER:-https://master.apis.dev.openstreetmap.org}
      MR_OAUTH_CONSUMER_KEY: ${MR_OAUTH_CONSUMER_KEY:?Set MR_OAUTH_CONSUMER_KEY in .env}
      MR_OAUTH_CONSUMER_SECRET: ${MR_OAUTH_CONSUMER_SECRET:?Set MR_OAUTH_CONSUMER_SECRET in .env}
      MR_OSM_OAUTH2SCOPE: read_prefs
      MR_PUBLIC_ORIGIN: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
      MOBILE_OAUTH_CALLBACK_URI: https://${PUBLIC_HOST:?Set PUBLIC_HOST in .env}/oauth/mobile/callback
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:80/ping"]
      interval: 20s
      timeout: 7s
      start_period: 2m
      retries: 3
    networks: [backend, web]

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    environment:
      PUBLIC_HOST: ${PUBLIC_HOST:?Set PUBLIC_HOST in .env}
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/mobile/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks: [web]

networks:
  backend:
    internal: true
  web: {}

volumes:
  postgres-data: {}
  caddy-data: {}
  caddy-config: {}
