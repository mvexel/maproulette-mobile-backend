# Reused by two distinct Komodo projects. No project name here: each environment
# must have its own Compose project and therefore its own PostgreSQL volume.
services:
  db:
    image: postgis/postgis:17-3.5
    restart: unless-stopped
    environment:
      POSTGRES_DB: maproulette
      POSTGRES_USER: maproulette
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the deployment database password}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U maproulette -d maproulette"]
      interval: 10s
      timeout: 5s
      retries: 12
    networks: [backend]

  api:
    image: maproulette-mobile-backend:${MR_DEPLOYMENT:?Set stage or prod}
    build:
      context: .
      dockerfile: Dockerfile
    pull_policy: build
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    command:
      - /MapRouletteAPI/bin/maprouletteapi
      - -Dhttp.port=80
      - -Dpidfile.path=/dev/null
      - -Dconfig.file=/MapRouletteAPI/conf/mobile-field.conf
    environment:
      MR_DATABASE_URL: jdbc:postgresql://db:5432/maproulette
      MR_DATABASE_USERNAME: maproulette
      MR_DATABASE_PASSWORD: ${POSTGRES_PASSWORD:?Set the deployment database password}
      APPLICATION_SECRET: ${APPLICATION_SECRET:?Set the deployment Play secret}
      MAPROULETTE_SECRET_KEY: ${MAPROULETTE_SECRET_KEY:?Set the deployment encryption secret}
      MR_PUBLIC_ORIGIN: https://${MR_API_HOST:?Set the deployment API host}
      MR_OSM_SERVER: https://www.openstreetmap.org
      MR_OSM_OAUTH2SCOPE: read_prefs
      MR_MOBILE_OSM_TOKEN_KEY: ${MR_MOBILE_OSM_TOKEN_KEY:-}
      MR_OAUTH_CONSUMER_KEY: ${MR_OAUTH_CONSUMER_KEY:?Set the production OSM OAuth client ID}
      MR_OAUTH_CONSUMER_SECRET: ${MR_OAUTH_CONSUMER_SECRET:?Set the production OSM OAuth client secret}
      MOBILE_OAUTH_CALLBACK_URI: https://${MR_API_HOST:?Set the deployment API host}/oauth/mobile/callback
      MR_MOBILE_ADMIN_ORIGIN: https://${MR_ADMIN_HOST:?Set the deployment admin host}
      MR_MOBILE_ADMIN_CALLBACK_URI: https://${MR_ADMIN_HOST:?Set the deployment admin host}/callback
      MR_SUPER_ACCOUNTS: ${MR_SUPER_ACCOUNTS:-}
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "--show-error", "--max-time", "5", "http://127.0.0.1:80/ping"]
      interval: 20s
      timeout: 7s
      start_period: 2m
      retries: 3
    networks:
      backend: {}
      ingress:
        aliases:
          - ${MR_API_NETWORK_ALIAS:?Set a unique API network alias}

networks:
  backend:
    internal: true
  ingress:
    name: schaaltreinenhuis-ingress
    external: true

volumes:
  postgres-data: {}
