include "application.conf"

# Isolated mobile SDK staging service. The existing web login and personal API
# key routes remain available. App grants can lock, skip, release and resolve
# MapRoulette tasks; with osm:tagfix (needs MR_MOBILE_OSM_TOKEN_KEY) the backend
# also applies choice-task answers to OSM as the user.
maproulette.publicOrigin = "https://mr-api.osm.lol"
maproulette.publicOrigin = ${?MR_PUBLIC_ORIGIN}
maproulette.devMode = false
osm.oauth2Scope = ${MR_OSM_OAUTH2SCOPE}

mobileOAuth {
  enabled = true
  callbackUri = ${MOBILE_OAUTH_CALLBACK_URI}
  clients = [{
    id = "maproulette-android-example"
    name = "MapRoulette Android Example"
    redirectUris = ["org.maproulette.example:/oauth2redirect"]
    scopes = ["tasks:read", "tasks:write", "osm:tagfix"]
  }]
}
