include "application.conf"

# A fresh, isolated deployment against production OSM. Mobile task writes stay
# disabled in the server until the per-environment rollout is approved.
maproulette.publicOrigin = ${MR_PUBLIC_ORIGIN}
maproulette.devMode = false
# The existing addFileTasks line-by-line ingest enforces this cap before
# accepting rows. Admin bearer grants can only use that ingest shape.
maproulette.task.max_tasks_per_challenge = 5000
osm.oauth2Scope = "read_prefs"

mobileOAuth {
  enabled = true
  allowTaskWrites = true
  writeControlEnabled = true
  callbackUri = ${MOBILE_OAUTH_CALLBACK_URI}
  adminOrigin = ${MR_MOBILE_ADMIN_ORIGIN}
  clients = [{
    id = "maproulette-android-example"
    name = "MapRoulette Android Example (read-only bootstrap)"
    redirectUris = ["org.maproulette.example:/oauth2redirect"]
    scopes = ["tasks:read"]
  },
  {
    id = "maproulette-ios-example"
    name = "MapRoulette iOS Example (read-only bootstrap)"
    redirectUris = ["org.maproulette.example:/oauth2redirect"]
    scopes = ["tasks:read"]
  },
  {
    id = "maproulette-mobile-admin"
    name = "MapRoulette Mobile Admin"
    redirectUris = [${MR_MOBILE_ADMIN_CALLBACK_URI}]
    scopes = ["mobile:admin"]
  }]
}
