include "mobile-field.conf"

# This selected stage config adds a native guest-capable client. The shared
# field/prod config retains its read-only examples and admin client unchanged.
# Guest routes still default off via MR_MOBILE_GUESTS_ENABLED in application.conf.
# Keep writeControlEnabled true and the audited database write policy Disabled.
mobileOAuth.clients += {
  id = "maproulette-ios-choice"
  name = "MapRoulette Choice (stage pending guest survey)"
  redirectUris = ["lol.osm.maproulette.choice:/oauth2redirect"]
  scopes = ["tasks:read", "guest"]
}
